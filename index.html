<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Note Board</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p>OFFLINE-FIRST</p><h1>QR Note Board</h1></div><button id="new">+ New note</button></header><input id="search" class="search" placeholder="Search notes..."><section id="notes" class="notes"></section></main><dialog id="editor"><form method="dialog" id="form"><h2 id="formTitle">New note</h2><input id="noteTitle" placeholder="Title" required><textarea id="noteBody" rows="7" placeholder="Write something..."></textarea><div class="row"><button value="cancel" class="ghost">Cancel</button><button id="save" value="default">Save</button></div></form></dialog><dialog id="qr"><button id="closeQr" class="close">×</button><h2 id="qrTitle"></h2><div id="qrcode"></div><p id="qrText"></p></dialog><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="app.js"></script></body></html>
